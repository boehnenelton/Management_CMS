<!DOCTYPE html>
<!-- Canonical source: scaffold_template.html — do not edit independently. -->
<!--
  File:         template.html
  Description:  Management_CMS — empty page template.
                One main panel + one system panel (bottom of sidebar).
                Links hb_style.css from the same directory.
  Version:      1.0.0
  Date:         2026-06-27
  Author:       Elton Boehnen
  RELATIONAL_ID: c9e3b5a2-7d1f-4a8c-b6e4-2f0d9c8e1a47
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>App Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages_style.css">
</head>
<body>

<div id="toast" class="toast"></div>

<div id="modalOv" class="modal-ov">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" onclick="handleSave()">Save</button>
    </div>
  </div>
</div>

<header class="app-header">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
      <rect y="2" width="18" height="2" rx="1"/>
      <rect y="8" width="18" height="2" rx="1"/>
      <rect y="14" width="18" height="2" rx="1"/>
    </svg>
  </button>
  <span class="app-title">App Title</span>
  <span class="app-version">v1.0.0</span>
</header>

<div class="sidebar-ov" id="sidebarOv" onclick="closeSidebar()"></div>

<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <!-- Main nav items -->
      <button class="nav-btn active" onclick="go('main',this)">
        <span class="nav-icon">📄</span>Main
      </button>
      <!-- Add nav items here -->
    </div>

    <!-- System nav — pinned to bottom -->
    <div class="sidebar-system">
      <button class="nav-btn" onclick="go('system',this)">
        <span class="nav-icon">⚙️</span>System
      </button>
    </div>

    <div class="sidebar-foot">
      Elton Boehnen<br>
      eltonboehnen@gmail.com<br>
      boehnenelton2024.pages.dev
    </div>
  </nav>

  <main class="app-main">
    <nav class="toolbar" id="toolbar"></nav>
    <div class="app-content">

      <!-- MAIN PANEL -->
      <div class="panel active" id="panel-main">
        <!-- content here -->
      </div>

      <!-- SYSTEM PANEL -->
      <div class="panel" id="panel-system">
        <!-- system / settings content here -->
      </div>

    </div>
  </main>
</div>

<script>
"use strict";

var P = "main";
var editTarget = null;

/* ── toast ── */
function toast(msg, type) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type || "toast-ok");
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.className = "toast"; }, 2600);
}

/* ── api ── */
async function api(method, url, body) {
  var o = { method: method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) o.body = JSON.stringify(body);
  var r = await fetch(url, o), d = await r.json();
  if (!r.ok && !d.error) d.error = "HTTP " + r.status;
  return d;
}

/* ── escape ── */
function esc(s) {
  // AUDIT FIX (H-3): hardened to match templates/index.html's esc() —
  // also encodes ' and ` to close JS-string-context breakout vectors.
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;").replace(/`/g, "&#96;");
}

/* ── nav ── */
function go(name, btn) {
  document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
  document.querySelectorAll(".nav-btn").forEach(function (b) { b.classList.remove("active"); });
  document.getElementById("panel-" + name).classList.add("active");
  if (btn) btn.classList.add("active");
  P = name;
  closeSidebar();
  renderToolbar(name);
  loadPanel(name);
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOv").classList.toggle("open");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOv").classList.remove("open");
}

/* ── toolbar ── */
function renderToolbar(panel) {
  var toolbars = {
    main:   "",   /* inject toolbar buttons for main panel */
    system: "",   /* inject toolbar buttons for system panel */
  };
  document.getElementById("toolbar").innerHTML = toolbars[panel] || "";
}

/* ── panel loaders ── */
function loadPanel(name) {
  var loaders = { main: loadMain, system: loadSystem };
  if (loaders[name]) loaders[name]();
}
function loadMain()   { /* render main panel content */ }
function loadSystem() { /* render system panel content */ }

/* ── modal ── */
function openModal(title, bodyHtml) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("modalOv").classList.add("open");
  setTimeout(function () {
    var f = document.querySelector("#modalBody .form-in");
    if (f) f.focus();
  }, 55);
}
function closeModal() {
  document.getElementById("modalOv").classList.remove("open");
  editTarget = null;
}
document.getElementById("modalOv").addEventListener("click", function (e) {
  if (e.target === this) closeModal();
});
function handleSave() { /* dispatch to correct save fn based on P / editTarget */ }

/* ── helpers ── */
function fg(label, input) {
  return '<div class="form-grp"><label class="form-lbl">' + label + '</label>' + input + '</div>';
}
function empty(icon, msg) {
  return '<div class="empty"><div class="empty-ico">' + icon + '</div>' + msg + '</div>';
}

/* ── keyboard ── */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    if (document.getElementById("modalOv").classList.contains("open")) handleSave();
  }
});

/* ── init ── */
document.addEventListener("DOMContentLoaded", function () {
  renderToolbar("main");
  loadMain();
});
</script>
</body>
</html>
